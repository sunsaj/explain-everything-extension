<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selection Explainer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main aria-labelledby="popupTitle">
    <header class="popup-header">
      <div class="brand-mark" aria-hidden="true">SE</div>
      <div>
        <p class="eyebrow">Browser assistant</p>
        <h1 id="popupTitle">Selection Explainer</h1>
      </div>
    </header>

    <p class="usage">Select text on a webpage, then choose <strong>Explain</strong>.</p>

    <section class="control-card" aria-labelledby="enabledLabel">
      <div class="control-copy">
        <label id="enabledLabel" for="enabledToggle">Extension enabled</label>
        <p id="enabledHint">Show the Explain button on supported pages.</p>
      </div>
      <input id="enabledToggle" class="toggle" type="checkbox"
        aria-describedby="enabledHint" disabled>
    </section>

    <div class="configuration-row">
      <span class="configuration-label">Configuration</span>
      <span id="configurationStatus" class="badge" data-state="checking" role="status" aria-live="polite" aria-atomic="true">Checking...</span>
    </div>

    <button id="openSettings" class="settings-button" type="button">Open settings</button>

    <p id="popupStatus" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
